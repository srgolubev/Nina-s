name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/review-plan-website-f8xS4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, without cancelling an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build site
        # When the TINA_TOKEN secret is present, build the editable /admin
        # bundle too (build:cms). Without it, fall back to the plain build so
        # the public site keeps deploying even before Tina Cloud is wired up.
        run: |
          if [ -n "$TINA_TOKEN" ]; then
            echo "TINA_TOKEN present — building site with the Tina admin"
            npm run build:cms
          else
            echo "No TINA_TOKEN — building the public site only"
            npm run build
          fi
        env:
          # Project site is served from https://srgolubev.github.io/Nina-s/
          BASE_PATH: /Nina-s
          # Tina Cloud — Client ID is public, token comes from the secret.
          TINA_CLIENT_ID: b4e69da7-1f3f-4cc1-8c43-83e583207eb5
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
          # Tina reads/writes content on the branch this workflow runs on.
          GITHUB_BRANCH: ${{ github.ref_name }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
